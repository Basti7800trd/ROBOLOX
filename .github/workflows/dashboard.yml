name: Dashboard (note + website)

# Builds Dashboard.md (for Obsidian) and index.html (the website) from the vault
# and commits both. GitHub Pages serves index.html straight from the main branch,
# so no Pages settings need changing.
on:
  push:
    branches: [main]
    paths-ignore:
      - Dashboard.md
      - index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Dashboard.md and the website from the vault
        run: |
          python3 .github/dashboard/build.py
          cp _site/index.html index.html
      - name: Commit them back
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dashboard.md index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Dashboard"
          git pull --rebase -X theirs || true
          git push
